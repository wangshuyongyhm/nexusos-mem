# ci.yml — NEXUS pypi 独立 repo CI 骨架（Task679 批4c 定稿：每 repo 独立形态）
#
# 形态裁决（slice-design §8 开放问题 1 落位）：三包各自独立 GitHub repo——
# 本模板被 nexus-slice.py 注入每个 repo 的 .github/workflows/ci.yml，
# 仓库根即包根（pyproject.toml 在根），无 monorepo 路径前缀。
#
# 矩阵：python 3.10/3.11/3.12（requires-python >=3.10）。
# 依赖分层：只装 core（pip install -e . 读 pyproject dependencies）——
# nexusos-mem 刻意不装 [full]（BGE 缺席 → FTS 兜底 = 懒 import 隔离面回归）。
#
# 测试现状（2026-08-20）：包内测试尚薄（gate 2 个）——pytest 退出码 5
# （no tests collected）按骨架期容忍，测试迁入后删 `|| [ $? -eq 5 ]`。

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # ── PG 服务（Task1605 T1）：mem 3 个测试直连 PG（provenance/relation_graph/
    # semantic_edges 连 NEXUS_PG_DSN），没有这层 service CI 必炸。
    # 用 pgvector 镜像而非裸 postgres——knowledge.embedding 是 vector 列，
    # 裸库没有 vector 扩展，装回去更麻烦，直接用带扩展的镜像一步到位。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_mem
        ports:
          - 5432:5432
        # 健康门槛：pg_isready 通了才算 service 就绪（job 等 ready 不抢跑）
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # mem 测试的连接串（shared.DEFAULT_DSN 读 NEXUS_PG_DSN；库名对齐本地 nexus_mem）
      NEXUS_PG_DSN: postgresql://nexus:nexus@localhost:5432/nexus_mem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core deps only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ── schema 初始化（仅 nexusos-mem 仓生效，其他仓无 sql/ 自动跳过）──
      # 基础 knowledge 表 DDL 未全量入 sql/（身份层/关系层/读模型在）——
      # 现阶段先把在册 DDL 铺上；全量 schema 导出是 OSS 后续项（见 1605 report UK）。
      - name: Init PG schema (mem only)
        if: hashFiles('sql/*.sql') != ''
        run: |
          pip install psycopg2-binary
          python - << 'EOF'
          import glob, psycopg2, os
          conn = psycopg2.connect(os.environ["NEXUS_PG_DSN"])
          conn.autocommit = True
          for f in sorted(glob.glob("sql/*.sql")):
              sql = open(f, encoding="utf-8").read()
              conn.cursor().execute(sql)
              print("applied:", f)
          conn.close()
          EOF

      - name: pytest
        run: |
          pip install pytest
          python -m pytest -q || [ $? -eq 5 ]
