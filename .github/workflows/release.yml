# release.yml — NEXUS pypi 独立 repo tag 驱动发布流（task 1963 单5，design §7）
#
# 触发：push tag v*（lockstep 同名 tag，如 v1.0.0-rc1 / v1.0.0）。
# 行为：build wheel+sdist → TestPyPI 上传。
#
# 🔴 正式 PyPI 发布=用户授意节点，本模板不接（后续需要时另加 stable-tag job，
#    参考 design §7「TestPyPI（pre-release tag）→ 正式 PyPI（稳定 tag）」两段式）。
#
# 认证二选一（按 repo 设置取其一）：
#   A. Trusted Publisher（推荐）：TestPyPI 项目页配置 GitHub OIDC 指向本 workflow，
#      下面 password 留空即可走 OIDC 免 token。
#   B. API token：repo secrets 配 TESTPYPI_API_TOKEN，取消 password 注释。

name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-publish:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # Trusted Publisher OIDC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # tag/版本一致性门禁：tag v1.2.3 必须等于包声明版本（lockstep 对账）
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DECLARED=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$DECLARED" ]; then
            echo "::error::tag v$TAG != pyproject version $DECLARED（lockstep 对账失败）"
            exit 1
          fi

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # password: ${{ secrets.TESTPYPI_API_TOKEN }}  # 方案 B 时启用；方案 A 走 OIDC 留空
          skip-existing: true
